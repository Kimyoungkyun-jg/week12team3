; HitoriGame 실행 설정. 실행 파일 옆 GameConfig 폴더에서 읽는다.
; 항목이 없거나 값이 잘못되면 코드의 기본값을 쓴다.

[Game]
; 시작할 씬. 실행 파일 폴더 기준 상대 경로
GameDefaultMap=Assets/Scenes/Default.scene
; 비워 두면 하늘을 그리지 않는다
SkyPanorama=Resources/SkySphere/UnrealDefaultSky.hdr

[Window]
Title=Hitori
; 0이면 주 모니터 해상도. Borderless=1과 함께 쓰면 테두리 없는 전체 화면이 된다
ResolutionSizeX=1600
ResolutionSizeY=900
Borderless=0
VSync=1

; 키 이름과 값 형식은 editor.ini의 [Rendering]과 같다
[Rendering]
RenderingPath=Forward
LightingModel=Phong
LightCullingMode=Tiled
EnableFXAA=1
CacheShadows=1
; 0=Off(필터 없음) 1=PCF 3x3 2=PCF 5x5 3=PCF 7x7 4=PCSS
PcfMode=3
; 캐스케이드 한 장 / Spot·Point 한 장의 최대 크기 (2의 거듭제곱, 최대 4096)
DirectionalShadowMapSize=2048
PointShadowMapSize=2048
SpotShadowMapSize=2048
GammaCorrection=1
DisplayGamma=2.2
ShowVignette=1
ShowCameraOverlay=1
